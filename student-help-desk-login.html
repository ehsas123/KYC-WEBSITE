<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Help Desk | Kishanganj Youth Club</title>

    <style>
        :root {
            --bg: #070a08;
            --bg-soft: #0c110e;

            --text: #f2f5f3;
            --text-dim: #9ca7a0;

            --green: #4ade80;
            --green-soft: rgba(74, 222, 128, 0.10);

            --border: rgba(255, 255, 255, 0.10);
            --border-green: rgba(74, 222, 128, 0.30);

            --radius: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(74, 222, 128, 0.07),
                    transparent 35%
                ),
                var(--bg);

            color: var(--text);

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }


        /* Background grid */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;

            mask-image: linear-gradient(
                to bottom,
                black,
                transparent 85%
            );

            pointer-events: none;
        }


        /* Main card */

        .coming-soon {
            position: relative;

            width: 100%;
            max-width: 620px;

            padding: 55px 40px;

            text-align: center;

            background: rgba(255, 255, 255, 0.025);

            border: 1px solid var(--border);

            border-radius: 20px;

            backdrop-filter: blur(18px);

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.45);

            overflow: hidden;
        }


        /* Green glow */

        .coming-soon::before {
            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            top: -130px;
            left: 50%;

            transform: translateX(-50%);

            background: rgba(74, 222, 128, 0.10);

            filter: blur(60px);

            border-radius: 50%;
        }


        /* Logo */

        .logo {
            position: relative;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            width: 64px;
            height: 64px;

            margin-bottom: 25px;

            border-radius: 16px;

            background: var(--green-soft);

            border: 1px solid var(--border-green);

            color: var(--green);
        }

        .logo svg {
            width: 32px;
            height: 32px;
        }


        /* Badge */

        .badge {
            display: inline-flex;

            align-items: center;
            gap: 7px;

            padding: 6px 12px;

            margin-bottom: 18px;

            border: 1px solid var(--border-green);

            border-radius: 999px;

            background: var(--green-soft);

            color: var(--green);

            font-size: 0.68rem;

            font-weight: 700;

            letter-spacing: 0.08em;

            text-transform: uppercase;
        }

        .badge-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: var(--green);

            box-shadow:
                0 0 10px rgba(74, 222, 128, 0.7);
        }


        /* Heading */

        h1 {
            position: relative;

            margin-bottom: 14px;

            font-size: clamp(2rem, 5vw, 3rem);

            line-height: 1.1;

            letter-spacing: -0.04em;
        }

        h1 span {
            color: var(--green);
        }


        /* Description */

        .description {
            max-width: 470px;

            margin: 0 auto;

            color: var(--text-dim);

            font-size: 0.92rem;

            line-height: 1.7;
        }


        /* Features */

        .features {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin-top: 35px;
        }

        .feature {
            padding: 15px 10px;

            border: 1px solid var(--border);

            border-radius: 12px;

            background: rgba(255,255,255,0.02);
        }

        .feature svg {
            width: 20px;
            height: 20px;

            margin-bottom: 8px;

            color: var(--green);
        }

        .feature span {
            display: block;

            color: var(--text-dim);

            font-size: 0.67rem;

            line-height: 1.4;
        }


        /* Button */

        .home-btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            margin-top: 32px;

            padding: 11px 18px;

            border: 1px solid var(--border);

            border-radius: 10px;

            background: rgba(255,255,255,0.035);

            color: var(--text);

            text-decoration: none;

            font-size: 0.78rem;

            font-weight: 600;

            transition: 0.25s ease;
        }

        .home-btn:hover {
            border-color: var(--border-green);

            background: var(--green-soft);

            color: var(--green);

            transform: translateY(-2px);
        }


        /* Footer */

        .footer {
            margin-top: 32px;

            color: #66716a;

            font-size: 0.62rem;
        }


        /* Mobile */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .coming-soon {
                padding: 40px 22px;
            }

            .features {
                grid-template-columns: 1fr;

                gap: 8px;
            }

            .feature {
                display: flex;

                align-items: center;

                gap: 10px;

                text-align: left;

                padding: 11px 13px;
            }

            .feature svg {
                margin: 0;
                flex-shrink: 0;
            }

            .feature span {
                font-size: 0.68rem;
            }

            .description {
                font-size: 0.82rem;
            }
        }
    </style>
</head>


<body>

    <main class="coming-soon">

        <!-- Student Icon -->

        <div class="logo">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.7"
                 stroke-linecap="round"
                 stroke-linejoin="round">

                <path d="M2 10l10-5 10 5-10 5L2 10z"/>

                <path d="M6 12.5v4.2c0 .8 2.7 2.8 6 2.8s6-2 6-2.8v-4.2"/>

                <path d="M20 10v5"/>

            </svg>

        </div>


        <!-- Status -->

        <div class="badge">
            <span class="badge-dot"></span>
            Under Development
        </div>


        <!-- Heading -->

        <h1>
            Student Help <span>Desk</span>
        </h1>


        <!-- Description -->

        <p class="description">
            A dedicated platform by Kishanganj Youth Club to help
            students with admission, scholarships, examinations,
            documents, college selection and career guidance.
        </p>


        <!-- Features -->

        <div class="features">

            <!-- Admission -->

            <div class="feature">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.8"
                     stroke-linecap="round"
                     stroke-linejoin="round">

                    <path d="M2 10l10-5 10 5-10 5L2 10z"/>
                    <path d="M6 12.5v4.2c0 .8 2.7 2.8 6 2.8s6-2 6-2.8v-4.2"/>

                </svg>

                <span>Admission Support</span>

            </div>


            <!-- Scholarship -->

            <div class="feature">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.8"
                     stroke-linecap="round"
                     stroke-linejoin="round">

                    <circle cx="12" cy="12" r="9"/>
                    <path d="M9 8h4a2 2 0 010 4H9a2 2 0 000 4h5"/>
                    <path d="M12 6v12"/>

                </svg>

                <span>Scholarship Help</span>

            </div>


            <!-- Career -->

            <div class="feature">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.8"
                     stroke-linecap="round"
                     stroke-linejoin="round">

                    <rect x="3" y="7" width="18" height="13" rx="2"/>
                    <path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/>
                    <path d="M3 12h18"/>
                    <path d="M10 12v2h4v-2"/>

                </svg>

                <span>Career Guidance</span>

            </div>

        </div>


        <!-- Home -->

        <a href="index.html" class="home-btn">

            <svg viewBox="0 0 24 24"
                 width="16"
                 height="16"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">

                <path d="M3 10.5L12 3l9 7.5"/>
                <path d="M5 9.5V21h14V9.5"/>
                <path d="M9 21v-6h6v6"/>

            </svg>

            Back to Home

        </a>


        <div class="footer">
            © 2026 Kishanganj Youth Club
        </div>

    </main>

</body>
</html>
